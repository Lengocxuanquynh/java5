spring.application.name=Java5

# ===================================================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU MICROSOFT SQL SERVER
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=java5;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# CẤU HÌNH HIBERNATE JPA & SQL LOGS
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# ===================================================================
# CẤU HÌNH THÔNG BÁO LỖI (MESSAGES BUNDLE)
# ===================================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8