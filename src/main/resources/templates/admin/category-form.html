<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Danh Mục | PolyShop Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/static/css/polyshop.css}">
</head>
<body class="bg-light">

  <!-- Admin Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" th:href="@{/admin}">
        <i class="bi bi-shield-lock-fill"></i>
        <span>PolyShop Admin</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" th:href="@{/admin}"><i class="bi bi-speedometer2 me-1"></i>Tổng Quan</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/admin/product-form}"><i class="bi bi-box-seam me-1"></i>Sản Phẩm</a></li>
          <li class="nav-item"><a class="nav-link active" th:href="@{/admin/category-form}"><i class="bi bi-tags me-1"></i>Danh Mục</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/admin/orders}"><i class="bi bi-receipt me-1"></i>Đơn Hàng</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/admin/user-form}"><i class="bi bi-people me-1"></i>Người Dùng</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a th:href="@{/}" class="btn btn-outline-light btn-sm" target="_blank"><i class="bi bi-shop me-1"></i>Trang Khách</a>
          <a th:href="@{/logout}" class="btn btn-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Đăng Xuất</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="py-4">
    <div class="container">

      <!-- Alerts -->
      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="row g-4">
        <!-- Left: Form -->
        <div class="col-lg-5">
          <div class="bg-white rounded-3 p-4 shadow-sm border">
            <h5 class="fw-bold text-dark border-bottom pb-3 mb-3">
              <i class="bi bi-tag-fill text-danger me-2"></i>
              <span th:if="${bean.id != null && bean.id.isPresent()}">Cập Nhật Danh Mục</span>
              <span th:unless="${bean.id != null && bean.id.isPresent()}">Thêm Danh Mục Mới</span>
            </h5>

            <form method="post" th:action="@{/admin/category-form}" th:object="${bean}">
              <th:block th:if="*{id != null && id.isPresent()}">
                <input type="hidden" name="id" th:value="*{id.get()}"/>
              </th:block>

              <div class="mb-3">
                <label for="name" class="form-label small fw-semibold">Tên danh mục sản phẩm *</label>
                <input th:field="*{name}" type="text" class="form-control" id="name" placeholder="Ví dụ: Thiết bị điện tử"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                <small class="text-danger" th:errors="*{name}"></small>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-polyshop-orange px-4">
                  <i class="bi bi-save me-1"></i>Lưu Danh Mục
                </button>
                <a th:href="@{/admin/category-form}" class="btn btn-outline-secondary">
                  Làm Mới
                </a>
              </div>
            </form>
          </div>
        </div>

        <!-- Right: Category Table -->
        <div class="col-lg-7">
          <div class="bg-white rounded-3 p-4 shadow-sm border">
            <h5 class="fw-bold text-dark border-bottom pb-3 mb-3">
              <i class="bi bi-list-task text-danger me-2"></i>Danh Sách Danh Mục
            </h5>

            <div class="table-responsive">
              <table class="table table-hover align-middle small">
                <thead class="table-light">
                  <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Tên danh mục</th>
                    <style style="display:none;"></style>
                    <th style="width: 120px;">Số sản phẩm</th>
                    <th class="text-end" style="width: 120px;">Thao tác</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="cat : ${categories}">
                    <td class="fw-bold" th:text="${cat.id}">1</td>
                    <td class="fw-semibold text-dark" th:text="${cat.name}">Điện thoại</td>
                    <td>
                      <span class="badge bg-light text-dark border"
                            th:text="${cat.products != null ? #lists.size(cat.products) : 0}">0</span>
                    </td>
                    <td class="text-end">
                      <a th:href="@{'/admin/category-form/' + ${cat.id}}" class="btn btn-sm btn-outline-primary me-1" title="Sửa">
                        <i class="bi bi-pencil-square"></i>
                      </a>
                      <a th:href="@{'/admin/category/delete/' + ${cat.id}}" class="btn btn-sm btn-outline-danger" title="Xóa"
                         onclick="return confirm('Bạn có chắc muốn xóa danh mục này?');">
                        <i class="bi bi-trash"></i>
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
