<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng | PolyShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/static/css/polyshop.css}">
</head>

<body>
  <!-- Navigation Header Fragment -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="main-content py-4">
    <div class="container">

      <!-- Error Alert -->
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>



      <!-- Empty Cart State -->
      <div th:if="${#lists.isEmpty(cartItems)}" class="bg-white rounded-3 p-5 text-center shadow-sm">
        <i id="emptyCartIcon" class="bi bi-cart-x fs-1 text-muted mb-2"></i>
        <h5 class="fw-bold text-dark">Giỏ hàng của bạn còn trống</h5>
        <p class="text-muted small">Hãy thêm những món đồ yêu thích vào giỏ hàng ngay nào!</p>
        <a th:href="@{/}" class="btn btn-polyshop-orange px-4 py-2 mt-2">MUA NGAY</a>
      </div>

      <!-- Cart Content -->
      <div th:if="${!#lists.isEmpty(cartItems)}">
        <!-- Table Header Card -->
        <div class="bg-white rounded-3 p-3 shadow-sm mb-3 d-none d-md-block text-secondary small fw-semibold">
          <div class="row align-items-center text-center">
            <div class="col-md-5 text-start ps-3 d-flex align-items-center">
              <input class="form-check-input mt-0 me-2" type="checkbox" id="selectAllHeader" checked>
              <label for="selectAllHeader" role="button" class="user-select-none mb-0">Sản Phẩm (Chọn tất cả)</label>
            </div>
            <div class="col-md-2">Đơn Giá</div>
            <div class="col-md-2">Số Lượng</div>
            <div class="col-md-2">Số Tiền</div>
            <div class="col-md-1">Thao Tác</div>
          </div>
        </div>

        <!-- Cart Item Rows -->
        <div class="bg-white rounded-3 shadow-sm mb-4">
          <div class="p-3 border-bottom d-flex align-items-center gap-2">
            <span class="badge bg-danger">PolyMall</span>
            <span class="fw-bold small text-dark">Cửa Hàng Chính Hãng</span>
          </div>

          <div th:each="item : ${cartItems}" class="p-3 border-bottom">
            <div class="row align-items-center text-center g-3">
              <!-- Product info with checkbox -->
              <div class="col-12 col-md-5 text-start">
                <div class="d-flex align-items-center gap-3">
                  <input class="form-check-input item-checkbox mt-0 me-1" type="checkbox" name="items"
                    form="checkoutForm" th:value="${item.product.id}" th:data-price="${item.product.salePrice}"
                    th:data-quantity="${item.quantity}" th:data-subtotal="${item.subTotal}" checked>
                  <img th:if="${item.product.images != null && !item.product.images.isEmpty()}"
                    th:src="@{'/uploads/' + ${item.product.images[0].name}}" class="rounded border p-1"
                    style="width: 70px; height: 70px; object-fit: cover;"
                    onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100&q=80';">
                  <img th:if="${item.product.images == null || item.product.images.isEmpty()}"
                    src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100&q=80"
                    class="rounded border p-1" style="width: 70px; height: 70px; object-fit: cover;">
                  <div>
                    <a th:href="@{'/product/' + ${item.product.id}}"
                      class="text-decoration-none text-dark fw-semibold small d-block mb-1"
                      th:text="${item.product.name}">Tên sản phẩm</a>
                    <span class="badge bg-light text-muted border small" th:text="${item.product.category.name}">Danh
                      mục</span>
                  </div>
                </div>
              </div>

              <!-- Price -->
              <div class="col-4 col-md-2 text-md-center">
                <span class="fw-semibold text-danger"
                  th:text="${#numbers.formatDecimal(item.product.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</span>
              </div>

              <!-- Quantity Form -->
              <div class="col-4 col-md-2">
                <form th:action="@{/cart/update}" method="post" class="d-inline-flex justify-content-center">
                  <input type="hidden" name="productId" th:value="${item.product.id}">
                  <div class="input-group input-group-sm" style="max-width: 110px;">
                    <button class="btn btn-outline-secondary" type="submit" name="quantity"
                      th:value="${item.quantity - 1}">-</button>
                    <input type="text" class="form-control text-center" th:value="${item.quantity}" readonly>
                    <button class="btn btn-outline-secondary" type="submit" name="quantity"
                      th:value="${item.quantity + 1}">+</button>
                  </div>
                </form>
              </div>

              <!-- Subtotal -->
              <div class="col-4 col-md-2 text-md-center">
                <span class="fw-bold text-danger"
                  th:text="${#numbers.formatDecimal(item.subTotal, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</span>
              </div>

              <!-- Action Delete -->
              <div class="col-12 col-md-1 text-end text-md-center">
                <a th:href="@{'/cart/remove/' + ${item.product.id}}" class="btn btn-sm btn-outline-danger" title="Xóa">
                  <i class="bi bi-trash"></i>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Sticky Checkout Summary Footer -->
        <div class="bg-white rounded-3 p-3 shadow-sm d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div class="d-flex align-items-center gap-3">
            <div class="form-check d-flex align-items-center mb-0">
              <input class="form-check-input mt-0 me-2" type="checkbox" id="selectAllFooter" checked>
              <label class="form-check-label small user-select-none" for="selectAllFooter" role="button">
                Chọn tất cả (<span id="totalItemsCount" th:text="${#lists.size(cartItems)}">0</span>)
              </label>
            </div>
            <a th:href="@{/cart/clear}" class="btn btn-outline-secondary btn-sm"
              onclick="return confirm('Bạn có chắc muốn xóa toàn bộ giỏ hàng?');">
              <i class="bi bi-trash me-1"></i>Xóa tất cả
            </a>
            <a th:href="@{/}" class="btn btn-link text-decoration-none text-muted btn-sm">
              <i class="bi bi-arrow-left me-1"></i>Tiếp tục mua hàng
            </a>
          </div>

          <div class="d-flex align-items-center gap-4">
            <div>
              <span class="text-secondary small">Tổng thanh toán (<span id="selectedCountDisplay"
                  th:text="${cartCount}">0</span> sản phẩm): </span>
              <span id="selectedTotalDisplay" class="fs-4 fw-bold text-danger"
                th:text="${#numbers.formatDecimal(totalAmount, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</span>
            </div>
            <form id="checkoutForm" th:action="@{/user/checkout}" method="get" class="m-0">
              <button th:if="${currentUser == null || currentUser.role != 1}" type="submit" id="btnCheckout"
                class="btn btn-polyshop-orange px-5 py-2 fw-bold shadow-sm">
                MUA HÀNG
              </button>
            </form>
            <div th:if="${currentUser != null && currentUser.role == 1}"
              class="d-flex align-items-center gap-2 text-danger small fw-semibold bg-danger-subtle px-3 py-2 rounded-2 border border-danger">
              <i class="bi bi-shield-slash fs-5"></i>
              <span>Admin không thể đặt mua hàng</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer Fragment -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const selectAllHeader = document.getElementById('selectAllHeader');
      const selectAllFooter = document.getElementById('selectAllFooter');
      const itemCheckboxes = document.querySelectorAll('.item-checkbox');
      const selectedCountDisplay = document.getElementById('selectedCountDisplay');
      const selectedTotalDisplay = document.getElementById('selectedTotalDisplay');
      const checkoutForm = document.getElementById('checkoutForm');

      function formatCurrency(number) {
        return new Intl.NumberFormat('vi-VN').format(number) + ' ₫';
      }

      function updateSummary() {
        let totalQty = 0;
        let totalPrice = 0;
        let checkedCount = 0;

        itemCheckboxes.forEach(cb => {
          if (cb.checked) {
            checkedCount++;
            const qty = parseInt(cb.getAttribute('data-quantity')) || 0;
            const subtotal = parseInt(cb.getAttribute('data-subtotal')) || 0;
            totalQty += qty;
            totalPrice += subtotal;
          }
        });

        if (selectedCountDisplay) {
          selectedCountDisplay.textContent = totalQty;
        }
        if (selectedTotalDisplay) {
          selectedTotalDisplay.textContent = formatCurrency(totalPrice);
        }

        const allChecked = itemCheckboxes.length > 0 && checkedCount === itemCheckboxes.length;
        if (selectAllHeader) selectAllHeader.checked = allChecked;
        if (selectAllFooter) selectAllFooter.checked = allChecked;
      }

      function toggleAll(checked) {
        itemCheckboxes.forEach(cb => {
          cb.checked = checked;
        });
        updateSummary();
      }

      if (selectAllHeader) {
        selectAllHeader.addEventListener('change', function () {
          toggleAll(this.checked);
        });
      }

      if (selectAllFooter) {
        selectAllFooter.addEventListener('change', function () {
          toggleAll(this.checked);
        });
      }

      itemCheckboxes.forEach(cb => {
        cb.addEventListener('change', updateSummary);
      });

      if (checkoutForm) {
        checkoutForm.addEventListener('submit', function (e) {
          const checked = document.querySelectorAll('.item-checkbox:checked');
          if (checked.length === 0) {
            e.preventDefault();
            alert('Bạn vẫn chưa chọn sản phẩm nào để mua hàng. Vui lòng tích chọn ít nhất 1 sản phẩm!');
            return false;
          }
        });
      }

      // Tính toán lại ngay khi tải trang
      updateSummary();
    });
  </script>
</body>

</html>
