<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Toán | PolyShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/static/css/polyshop.css}">
</head>

<body>
  <!-- Navigation Header Fragment -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="main-content py-4">
    <div class="container">

      <!-- Form Error Alert -->
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <form th:action="@{/user/checkout}" th:object="${checkoutBean}" method="post">

        <!-- Danh sách items đã chọn thanh toán (truyền trực tiếp qua form, không dùng Session) -->
        <th:block th:if="${selectedItems != null}">
          <input type="hidden" name="items" th:each="itemId : ${selectedItems}" th:value="${itemId}">
        </th:block>

        <!-- Tổng tiền dự kiến mà khách hàng nhìn thấy (dùng để đối chiếu lệch giá nếu Admin đổi giá) -->
        <input type="hidden" th:field="*{expectedTotal}">

        <!-- PolyShop Delivery Address Box with ribbon border effect -->
        <div class="bg-white rounded-3 p-4 shadow-sm mb-4 position-relative border-top border-4 border-danger">
          <h5 class="fw-bold text-danger mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-geo-alt-fill"></i>Địa Chỉ Nhận Hàng
          </h5>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Họ và Tên người nhận *</label>
              <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nhập họ và tên..."
                th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
              <small class="text-danger" th:errors="*{fullName}"></small>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Số điện thoại *</label>
              <input type="text" class="form-control" th:field="*{phone}" placeholder="Nhập số điện thoại..."
                th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
              <small class="text-danger" th:errors="*{phone}"></small>
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">Địa chỉ chi tiết (Số nhà, đường, phường/xã, quận/huyện,
                tỉnh/thành phố) *</label>
              <input type="text" class="form-control" th:field="*{address}"
                placeholder="Nhập số nhà, tên đường, phường/xã, quận/huyện..."
                th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''">
              <small class="text-danger" th:errors="*{address}"></small>
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">Ghi chú cho shipper (Tùy chọn)</label>
              <input type="text" class="form-control" th:field="*{note}"
                placeholder="Nhập ghi chú cho người giao hàng (nếu có)...">
            </div>
          </div>
        </div>

        <!-- Ordered Products Review Box -->
        <div class="bg-white rounded-3 p-4 shadow-sm mb-4">
          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
            <i class="bi bi-bag-check-fill text-danger me-2"></i>Sản Phẩm Đặt Mua
          </h5>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light small text-secondary">
                <tr>
                  <th>Sản phẩm</th>
                  <th class="text-center">Đơn giá</th>
                  <th class="text-center">Số lượng</th>
                  <th class="text-end">Thành tiền</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${cartItems}">
                  <td>
                    <div class="d-flex align-items-center gap-3">
                      <img th:if="${item.product.images != null && !item.product.images.isEmpty()}"
                        th:src="@{'/uploads/' + ${item.product.images[0].name}}" class="rounded border"
                        style="width: 50px; height: 50px; object-fit: cover;"
                        onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100&q=80';">
                      <img th:if="${item.product.images == null || item.product.images.isEmpty()}"
                        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100&q=80"
                        class="rounded border" style="width: 50px; height: 50px; object-fit: cover;">
                      <div>
                        <div class="fw-semibold small" th:text="${item.product.name}">Tên sản phẩm</div>
                        <span class="badge bg-light text-muted border" th:text="${item.product.category.name}">Danh
                          mục</span>
                      </div>
                    </div>
                  </td>
                  <td class="text-center small text-secondary">
                    <span th:text="${#numbers.formatDecimal(item.product.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</span>
                  </td>
                  <td class="text-center small fw-bold" th:text="${item.quantity}">1</td>
                  <td class="text-end fw-bold text-danger"
                    th:text="${#numbers.formatDecimal(item.subTotal, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Payment Method Box -->
        <div class="bg-white rounded-3 p-4 shadow-sm mb-4">
          <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
            <i class="bi bi-credit-card-2-back-fill text-danger me-2"></i>Phương Thức Thanh Toán
          </h5>

          <div class="d-flex flex-column gap-2">
            <div class="form-check p-3 border rounded-2">
              <input class="form-check-input" type="radio" th:field="*{paymentMethod}" id="payCOD" value="COD" checked>
              <label class="form-check-label d-flex align-items-center gap-2" for="payCOD">
                <i class="bi bi-cash text-success fs-5"></i>
                <div>
                  <strong>Thanh toán khi nhận hàng (COD)</strong>
                  <div class="small text-muted">Thanh toán bằng tiền mặt khi shipper giao hàng tới</div>
                </div>
              </label>
            </div>
            <div class="form-check p-3 border rounded-2">
              <input class="form-check-input" type="radio" th:field="*{paymentMethod}" id="payBank"
                value="BankTransfer">
              <label class="form-check-label d-flex align-items-center gap-2" for="payBank">
                <i class="bi bi-bank text-primary fs-5"></i>
                <div>
                  <strong>Chuyển khoản Ngân hàng (QR Code)</strong>
                  <div class="small text-muted">Quét mã VietQR chuyển khoản liên ngân hàng 24/7</div>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- Order Summary & Confirmation Box -->
        <div class="bg-white rounded-3 p-4 shadow-sm mb-4">
          <div class="row justify-content-end">
            <div class="col-md-5">
              <div class="d-flex justify-content-between mb-2 small text-secondary">
                <span>Tổng tiền hàng:</span>
                <span th:text="${#numbers.formatDecimal(totalAmount, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</span>
              </div>
              <div class="d-flex justify-content-between mb-2 small text-secondary">
                <span>Phí vận chuyển:</span>
                <span class="text-success fw-bold">Miễn phí (0 ₫)</span>
              </div>
              <hr>
              <div class="d-flex justify-content-between align-items-baseline mb-4">
                <span class="fw-bold fs-5">Tổng thanh toán:</span>
                <span class="display-6 fw-bold text-danger"
                  th:text="${#numbers.formatDecimal(totalAmount, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</span>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-polyshop-orange py-3 fs-5 fw-bold shadow-sm">
                  ĐẶT HÀNG
                </button>
              </div>
              <p class="text-muted small text-center mt-2 mb-0">
                Nhấn "Đặt hàng" đồng nghĩa với việc bạn đồng ý tuân theo <a href="#"
                  class="text-decoration-none text-danger">Điều khoản PolyShop</a>
              </p>
            </div>
          </div>
        </div>

      </form>

    </div>
  </main>

  <!-- Footer Fragment -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
