<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | PolyShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/static/css/polyshop.css}">
  <style>
    .auth-page {
      background-color: #ee4d2d;
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
    }
    .auth-card {
      background: #fff;
      border-radius: 6px;
      padding: 30px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <!-- Simplified Header for Auth -->
  <header class="bg-white py-3 border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a th:href="@{/}" class="text-danger fs-2 fw-bold text-decoration-none d-flex align-items-center gap-2">
          <i class="bi bi-bag-heart-fill"></i>
          <span>PolyShop</span>
        </a>
        <span class="fs-4 fw-semibold text-dark">Đăng Ký</span>
      </div>
    
    </div>
  </header>

  <!-- Auth Content Section -->
  <div class="auth-page py-5">
    <div class="container">
      <div class="row align-items-center justify-content-between">
        <!-- Left Branding -->
        <div class="col-lg-6 text-white d-none d-lg-block">
          <div class="text-center">
            <i class="bi bi-bag-heart" style="font-size: 110px;"></i>
            <h2 class="fw-bold mt-3">Đăng Ký Tài Khoản PolyShop</h2>
            <p class="lead opacity-75">Tham gia cộng đồng mua sắm trực tuyến uy tín và hiện đại</p>
          </div>
        </div>

        <!-- Right Form Card -->
        <div class="col-lg-5 col-md-8 mx-auto">
          <div class="auth-card">
            <h4 class="fw-bold text-dark mb-4">Đăng Ký</h4>

            <!-- Error message alert -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
              <i class="bi bi-exclamation-circle-fill me-1"></i><span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/register}" th:object="${bean}" method="post">
              <div class="mb-3">
                <input type="text" class="form-control py-2" th:field="*{username}" placeholder="Tên đăng nhập (username)"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                <small class="text-danger" th:errors="*{username}"></small>
              </div>

              <div class="mb-3">
                <input type="password" class="form-control py-2" th:field="*{password}" placeholder="Mật khẩu (tối thiểu 6 ký tự)"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                <small class="text-danger" th:errors="*{password}"></small>
              </div>

              <div class="mb-3">
                <input type="text" class="form-control py-2" th:field="*{name}" placeholder="Họ và tên"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                <small class="text-danger" th:errors="*{name}"></small>
              </div>

              <div class="mb-3">
                <input type="text" class="form-control py-2" th:field="*{email}" placeholder="Địa chỉ email"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                <small class="text-danger" th:errors="*{email}"></small>
              </div>

              <div class="mb-3">
                <input type="text" class="form-control py-2" th:field="*{phone}" placeholder="Số điện thoại (VD: 0987654321)"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                <small class="text-danger" th:errors="*{phone}"></small>
              </div>

              <button type="submit" class="btn btn-polyshop-orange w-100 py-2 fw-bold text-uppercase mb-3">
                Đăng Ký
              </button>
            </form>

            <div class="text-center small text-muted">
              Bạn đã có tài khoản?
              <a th:href="@{/login}" class="text-danger fw-bold text-decoration-none">Đăng nhập</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Fragment -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
