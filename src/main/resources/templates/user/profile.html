<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Tài Khoản | PolyShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/static/css/polyshop.css}">
</head>
<body class="bg-light">

  <!-- Navigation Header Fragment -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="main-content py-4">
    <div class="container">
      <div class="row g-4">

        <!-- Sidebar Navigation -->
        <div class="col-lg-3">
          <div class="bg-white rounded-3 p-3 shadow-sm border">
            <div class="d-flex align-items-center gap-3 pb-3 border-bottom mb-3">
              <div class="bg-danger text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4" style="width: 48px; height: 48px;">
                <i class="bi bi-person"></i>
              </div>
              <div>
                <div class="fw-bold text-dark" th:text="${currentUser != null ? currentUser.name : 'Người dùng PolyShop'}">Tên Người Dùng</div>
                <div class="text-muted small"><i class="bi bi-pencil me-1"></i>Sửa hồ sơ</div>
              </div>
            </div>

            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
              <button class="nav-link text-start text-dark fw-semibold active d-flex align-items-center gap-2 mb-1" id="tab-profile-btn" data-bs-toggle="pill" data-bs-target="#tab-profile" type="button">
                <i class="bi bi-person-badge text-danger"></i> Hồ Sơ Cá Nhân
              </button>
              <button class="nav-link text-start text-dark fw-semibold d-flex align-items-center gap-2 mb-1" id="tab-password-btn" data-bs-toggle="pill" data-bs-target="#tab-password" type="button">
                <i class="bi bi-shield-lock text-primary"></i> Đổi Mật Khẩu
              </button>
              <a th:href="@{/user/orders}" class="nav-link text-start text-dark fw-semibold d-flex align-items-center gap-2">
                <i class="bi bi-bag-check text-success"></i> Đơn Mua Của Tôi
              </a>
            </div>
          </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-lg-9">
          <div class="bg-white rounded-3 p-4 shadow-sm border">

            <div class="tab-content" id="v-pills-tabContent">

              <!-- Tab 1: Profile Info -->
              <div class="tab-pane fade show active" id="tab-profile" role="tabpanel">
                <h5 class="fw-bold text-dark border-bottom pb-3 mb-4">
                  <i class="bi bi-person-lines-fill text-danger me-2"></i>Hồ Sơ Của Tôi
                </h5>

                <div th:if="${successProfileMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                  <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successProfileMessage}"></span>
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/user/profile}" th:object="${profileBean}" method="post">
                  <input type="hidden" th:field="*{id}">

                  <div class="row mb-3 align-items-center">
                    <label class="col-md-3 col-form-label fw-semibold text-secondary">Tên đăng nhập</label>
                    <div class="col-md-9">
                      <input type="text" class="form-control-plaintext fw-bold" th:field="*{username}" readonly>
                    </div>
                  </div>

                  <div class="row mb-3 align-items-center">
                    <label for="name" class="col-md-3 col-form-label fw-semibold text-dark">Họ và Tên *</label>
                    <div class="col-md-9">
                      <input type="text" class="form-control" id="name" th:field="*{name}"
                             th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                      <small class="text-danger" th:errors="*{name}"></small>
                    </div>
                  </div>

                  <div class="row mb-3 align-items-center">
                    <label for="email" class="col-md-3 col-form-label fw-semibold text-dark">Địa chỉ Email *</label>
                    <div class="col-md-9">
                      <input type="text" class="form-control" id="email" th:field="*{email}"
                             th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                      <small class="text-danger" th:errors="*{email}"></small>
                    </div>
                  </div>

                  <div class="row mb-4 align-items-center">
                    <label for="phone" class="col-md-3 col-form-label fw-semibold text-dark">Số điện thoại</label>
                    <div class="col-md-9">
                      <input type="text" class="form-control" id="phone" th:field="*{phone}">
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-9 offset-md-3">
                      <button type="submit" class="btn btn-polyshop-orange px-4 py-2 fw-bold">
                        <i class="bi bi-save me-1"></i>Lưu Thay Đổi
                      </button>
                    </div>
                  </div>
                </form>
              </div>

              <!-- Tab 2: Change Password -->
              <div class="tab-pane fade" id="tab-password" role="tabpanel">
                <h5 class="fw-bold text-dark border-bottom pb-3 mb-4">
                  <i class="bi bi-shield-lock-fill text-primary me-2"></i>Đổi Mật Khẩu
                </h5>

                <div th:if="${successPasswordMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                  <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successPasswordMessage}"></span>
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/user/change-password}" th:object="${passwordBean}" method="post">

                  <div class="row mb-3 align-items-center">
                    <label for="currentPassword" class="col-md-3 col-form-label fw-semibold text-dark">Mật khẩu hiện tại *</label>
                    <div class="col-md-9">
                      <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}" placeholder="Nhập mật khẩu hiện tại"
                             th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''">
                      <small class="text-danger" th:errors="*{currentPassword}"></small>
                    </div>
                  </div>

                  <div class="row mb-3 align-items-center">
                    <label for="newPassword" class="col-md-3 col-form-label fw-semibold text-dark">Mật khẩu mới *</label>
                    <div class="col-md-9">
                      <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" placeholder="Tối thiểu 6 ký tự"
                             th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''">
                      <small class="text-danger" th:errors="*{newPassword}"></small>
                    </div>
                  </div>

                  <div class="row mb-4 align-items-center">
                    <label for="confirmPassword" class="col-md-3 col-form-label fw-semibold text-dark">Xác nhận mật khẩu *</label>
                    <div class="col-md-9">
                      <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới"
                             th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                      <small class="text-danger" th:errors="*{confirmPassword}"></small>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-9 offset-md-3">
                      <button type="submit" class="btn btn-primary px-4 py-2 fw-bold">
                        <i class="bi bi-key me-1"></i>Cập Nhật Mật Khẩu
                      </button>
                    </div>
                  </div>
                </form>
              </div>

            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Fragment -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:if="${activeTab == 'password'}">
    document.addEventListener('DOMContentLoaded', function() {
      var passwordTab = new bootstrap.Tab(document.getElementById('tab-password-btn'));
      passwordTab.show();
    });
  </script>
</body>
</html>
